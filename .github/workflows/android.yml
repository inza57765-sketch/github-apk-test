name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le projet
      - name: Récupérer le projet
        uses: actions/checkout@v4

      # 2. Installer Node.js
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Installer Java 21
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Vérifier Java
      - name: Vérifier Java
        run: java --version

      # 5. Préparer les fichiers Web
      - name: Préparer les fichiers Web
        run: |
          mkdir www
          cp index.html style.css app.js www/

      # 6. Installer Capacitor
      - name: Installer Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 7. Initialiser Capacitor
      - name: Initialiser Capacitor
        run: |
          npx cap init "GitHub APK Test" "com.cybertchak.githubapktest" --web-dir www

      # 8. Ajouter Android
      - name: Ajouter Android
        run: npx cap add android

      # 9. Synchroniser Capacitor
      - name: Synchroniser Capacitor
        run: npx cap sync android

      # 10. Construire l'APK
      - name: Construire APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 11. Publier l'APK
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: github-apk-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
